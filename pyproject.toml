[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-claude-remote"
version = "0.1.0"
description = "Bot Telegram que abre sessoes do Claude Code com Remote Control ativado, via long-polling."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mateus Oliveira", email = "mateusoliveira9785@gmail.com" }]
dependencies = ["requests>=2.31.0"]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
